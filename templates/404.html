{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div style="text-align: center; padding: 5rem 1rem;">
  <div style="font-size: 5rem; font-weight: 800; color: var(--accent-cyan); font-family: monospace; line-height: 1;">404</div>
  <h1 style="font-size: 1.75rem; font-weight: 700; margin: 1rem 0 0.5rem;">Page Not Located</h1>
  <p style="color: var(--text-muted); max-width: 480px; margin: 0 auto 2rem;">
    The requested weather intelligence endpoint or view could not be located on the server.
  </p>
  <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
